name: nightly-live-loop

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-live-loop:
    name: Run live loop for ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [swe-bench, magicbrush, claims-processing, finance-qa]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore ACE curator cache
        uses: actions/cache@v4
        with:
          path: |
            ace_playbook.db
            faiss_indices
          key: ace-${{ matrix.domain }}-${{ github.run_id }}
          restore-keys: |
            ace-${{ matrix.domain }}-

      - name: Restore replay buffer cache
        uses: actions/cache@v4
        with:
          path: data/replay_buffer.jsonl
          key: replay-${{ matrix.domain }}-${{ github.run_id }}
          restore-keys: |
            replay-${{ matrix.domain }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install git+https://github.com/jmanhype/ace-playbook.git

      - name: Configure ACE flag
        env:
          ACE_TOKEN: ${{ secrets.ACE_TOKEN }}
        run: |
          echo "ACE_ENABLED=1" >> "$GITHUB_ENV"
          echo "ACE_ARGS=--ace" >> "$GITHUB_ENV"
          echo "ACE_DOMAIN_ID=${{ matrix.domain }}" >> "$GITHUB_ENV"

      - name: Initialize ACE database schema
        run: |
          python - <<'PY'
          from ace.utils.database import init_database
          init_database("sqlite:///ace_playbook.db")
          PY

      - name: Run live loop
        env:
          ACE_ENABLED: ${{ env.ACE_ENABLED }}
          ACE_DOMAIN_ID: ${{ matrix.domain }}
          ACE_TARGET_STAGE: shadow
          DATABASE_URL: sqlite:///ace_playbook.db
          PYTHONPATH: src
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          python examples/live_loop_swe_magic.py --domain "${{ matrix.domain }}" --episodes 10 $ACE_ARGS

      - name: Update replay buffer
        run: |
          python scripts/update_replay_buffer.py --episodes-dir live_loop_artifacts --output data/replay_buffer.jsonl

      - name: Run experience replay training
        run: |
          python scripts/run_experience_replay.py --reflections-dir live_loop_artifacts --output-dir artifacts/replay --policy-output artifacts/policy_replay.pkl

      - name: Run benchmark drift check
        run: |
          mkdir -p results
          case "${{ matrix.domain }}" in
            swe-bench)
              suite="data/swe_bench_samples/swe_bench_50.jsonl"
              ;;
            magicbrush)
              suite="data/magicbrush_samples/magicbrush_50.jsonl"
              ;;
            claims-processing)
              suite="data/claims_samples/claims_20.jsonl"
              ;;
            finance-qa)
              suite="data/finance_samples/finance_20.jsonl"
              ;;
            *)
              echo "Unsupported domain ${{ matrix.domain }} for benchmark suite" >&2
              exit 1
              ;;
          esac
          python scripts/run_benchmark.py "$suite" --domain "${{ matrix.domain }}" --output "results/${{ matrix.domain }}_${{ github.run_id }}.json" --max-tasks 10 --offline

      - name: Run guardrail integrity sweep
        run: |
          python scripts/run_guardrail_sweep.py --domain "${{ matrix.domain }}" --output artifacts/replay/guardrail_sweep.json

      - name: Generate promotion review digest
        run: |
          python scripts/generate_promotion_digest.py --promotion-report artifacts/replay/promotion_report.json --output artifacts/replay/promotion_review.md

      - name: Export Prometheus metrics
        run: |
          python scripts/export_prom_metrics.py --metrics live_loop_artifacts/metrics.json --promotion-report artifacts/replay/promotion_report.json --output live_loop_artifacts/metrics.prom

      - name: Update metrics history
        run: |
          python scripts/update_metrics_history.py --metrics live_loop_artifacts/metrics.json --history artifacts/metrics_history.jsonl

      - name: Summarize live loop artifacts
        if: always()
        run: |
          python scripts/summarize_live_loop.py live_loop_artifacts > live_loop_summary.json
          echo '### Live loop summary' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat live_loop_summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f live_loop_artifacts/metrics.json ]; then
            echo '#### ACE Metrics' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{total_ace_updates, ace_update_history}' live_loop_artifacts/metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f live_loop_artifacts/metrics.prom ]; then
            echo '#### Prometheus Metrics' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat live_loop_artifacts/metrics.prom >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/replay/promotion_review.md ]; then
            echo '#### Promotion Review Digest' >> "$GITHUB_STEP_SUMMARY"
            echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
            head -n 50 artifacts/replay/promotion_review.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '> Full review: artifacts/replay/promotion_review.md' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate ACE ingestion
        if: always() && env.ACE_ENABLED == '1'
        run: |
          python scripts/validate_live_loop.py --metrics live_loop_artifacts/metrics.json

      - name: Post review digest comment
        if: >-
          always() && (
            vars.REVIEW_ISSUE_NUMBER != '' ||
            vars.REVIEW_ISSUE_NUMBER_SWE != '' ||
            vars.REVIEW_ISSUE_NUMBER_MAGICBRUSH != '' ||
            vars.REVIEW_ISSUE_NUMBER_CLAIMS != '' ||
            vars.REVIEW_ISSUE_NUMBER_FINANCE != ''
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_ISSUE_NUMBER_DEFAULT: ${{ vars.REVIEW_ISSUE_NUMBER }}
          REVIEW_ISSUE_NUMBER_SWE: ${{ vars.REVIEW_ISSUE_NUMBER_SWE }}
          REVIEW_ISSUE_NUMBER_MAGICBRUSH: ${{ vars.REVIEW_ISSUE_NUMBER_MAGICBRUSH }}
          REVIEW_ISSUE_NUMBER_CLAIMS: ${{ vars.REVIEW_ISSUE_NUMBER_CLAIMS }}
          REVIEW_ISSUE_NUMBER_FINANCE: ${{ vars.REVIEW_ISSUE_NUMBER_FINANCE }}
        run: |
          case "${{ matrix.domain }}" in
            swe-bench)
              issue_number="$REVIEW_ISSUE_NUMBER_SWE"
              ;;
            magicbrush)
              issue_number="$REVIEW_ISSUE_NUMBER_MAGICBRUSH"
              ;;
            claims-processing)
              issue_number="$REVIEW_ISSUE_NUMBER_CLAIMS"
              ;;
            finance-qa)
              issue_number="$REVIEW_ISSUE_NUMBER_FINANCE"
              ;;
            *)
              issue_number="$REVIEW_ISSUE_NUMBER_DEFAULT"
              ;;
          esac

          if [ -z "$issue_number" ]; then
            echo "No review issue configured for ${{ matrix.domain }}; skipping comment"
            exit 0
          fi

          if [ -f artifacts/replay/promotion_review.md ]; then
            body=$(printf "Nightly ACE review - domain %s (run %s)\n\n\`\`\`markdown\n%s\n\`\`\`\n[Artifacts](%s/%s/actions/runs/%s)" "${{ matrix.domain }}" "${{ github.run_id }}" "$(head -n 40 artifacts/replay/promotion_review.md)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
            gh issue comment "$issue_number" --body "$body"
          else
            echo "No promotion review for ${{ matrix.domain }}; skipping comment"
          fi

      - name: Upload live loop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-loop-${{ matrix.domain }}-${{ github.run_id }}
          path: |
            live_loop_artifacts/
            logs/
            live_loop_summary.json
            data/replay_buffer.jsonl
            artifacts/replay/
            artifacts/policy_replay.pkl
            artifacts/policy_prev.pkl
            artifacts/metrics_history.jsonl
            results/
            live_loop_artifacts/metrics.prom
          if-no-files-found: ignore
